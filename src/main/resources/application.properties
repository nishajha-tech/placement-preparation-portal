# ===================================================================
# PLACEMENT PREPARATION PORTAL - CORE APPLICATION CONFIGURATION
# ===================================================================
spring.application.name=PlacementPreparationPortal
server.port=${PORT:8088}

# Active Profile: 'h2' for zero-setup demo; switch to 'mysql' for MySQL server
spring.profiles.active=h2

# Thymeleaf Template Engine Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging Configuration
logging.level.org.springframework.web=INFO
logging.level.com.placementportal=DEBUG
